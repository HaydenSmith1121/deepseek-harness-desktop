<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- ======== 侧边栏 ======== -->
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">DH</div>
        <div class="brand-text">
          <div class="brand-name">DeepSeek Harness</div>
          <div class="brand-sub">智能体 · 批量评测 · 模型对比</div>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-view="chat">💬 对话</button>
        <button class="nav-btn" data-view="lab">🧪 评测台</button>
      </nav>
      <button id="btn-new-chat" class="btn-new-chat chat-only">＋ 新建对话</button>
      <div class="sessions-label chat-only">历史会话</div>
      <div id="session-list" class="session-list chat-only"></div>
      <div class="sidebar-footer">
        <button id="btn-settings" class="btn-ghost">⚙ 设置</button>
        <span id="app-version" class="version"></span>
      </div>
    </aside>

    <!-- ======== 主区域 ======== -->
    <main id="main" class="view">
      <header id="topbar">
        <div id="topbar-title" class="topbar-title">新对话</div>
        <div class="topbar-badges">
          <span id="badge-model" class="badge badge-model">deepseek-chat</span>
          <span id="badge-approval" class="badge" title="点击切换执行确认模式">确认模式</span>
          <span id="badge-workspace" class="badge badge-ws" title="智能体工作目录">工作目录</span>
        </div>
      </header>

      <div id="chat" class="chat">
        <div id="welcome" class="welcome">
          <div class="welcome-logo">DH</div>
          <h1>DeepSeek Harness</h1>
          <p>一个能真正动手干活的本地智能体：读写文件、执行命令、搜索代码、抓取网页。</p>
          <div class="welcome-examples">
            <button class="example" data-prompt="列出当前工作目录的结构，并给我一个简要的项目概览">📁 探索工作目录结构</button>
            <button class="example" data-prompt="在工作目录里创建一个 hello.py，运行它并把结果告诉我">🐍 写个脚本并运行</button>
            <button class="example" data-prompt="搜索工作目录里所有的 README 文件，总结它们的内容">🔍 搜索并总结文档</button>
            <button class="example" data-prompt="抓取 https://api.github.com/repos/markedjs/marked 的内容，告诉我这个项目是什么">🌐 联网查资料</button>
          </div>
        </div>
      </div>

      <div id="composer" class="composer">
        <textarea id="input" placeholder="给智能体下达任务…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
        <div class="composer-actions">
          <span id="composer-hint" class="composer-hint"></span>
          <button id="btn-stop" class="btn-stop hidden">■ 停止</button>
          <button id="btn-send" class="btn-send">发送 ➤</button>
        </div>
      </div>
    </main>

    <!-- ======== 评测台 ======== -->
    <main id="view-lab" class="view hidden">
      <header id="lab-topbar">
        <div class="lab-tabs">
          <button class="lab-tab active" data-tab="batch">批量评测</button>
          <button class="lab-tab" data-tab="compare">模型对比</button>
        </div>
        <div class="topbar-badges">
          <span id="lab-badge-progress" class="badge"></span>
          <button id="lab-export-json" class="btn-mini" disabled>导出 JSON</button>
          <button id="lab-export-csv" class="btn-mini" disabled>导出 CSV</button>
        </div>
      </header>

      <!-- ---- 批量评测 ---- -->
      <section id="lab-batch" class="lab-panel">
        <div class="lab-side">
          <div class="lab-group">
            <label class="lab-label">模型</label>
            <select id="batch-model">
              <option value="deepseek-chat">deepseek-chat</option>
              <option value="deepseek-reasoner">deepseek-reasoner</option>
            </select>
          </div>
          <div class="lab-group">
            <label class="lab-label">系统提示词（可选）</label>
            <textarea id="batch-system" rows="3" placeholder="例如：你是一个严谨的技术助手，回答要简洁。"></textarea>
          </div>
          <div class="lab-row">
            <div class="lab-group">
              <label class="lab-label">温度</label>
              <input type="number" id="batch-temp" min="0" max="2" step="0.1">
            </div>
            <div class="lab-group">
              <label class="lab-label">最大 tokens</label>
              <input type="number" id="batch-maxtokens" min="1" step="256">
            </div>
          </div>
          <div class="lab-row">
            <div class="lab-group">
              <label class="lab-label">并发数</label>
              <input type="number" id="batch-concurrency" min="1" max="32" step="1">
            </div>
            <div class="lab-group">
              <label class="lab-label">失败重试</label>
              <input type="number" id="batch-retries" min="0" max="5" step="1">
            </div>
          </div>
          <div class="lab-group grow">
            <label class="lab-label">
              数据集
              <span class="lab-hint">每行一条 · <code>提示词 | 关键词1,关键词2</code> 自动判定</span>
            </label>
            <textarea id="batch-dataset" spellcheck="false" placeholder="把这段文字翻译成英文：今天天气不错&#10;用一句话解释什么是 HTTP | HTTP,协议&#10;# 以 # 开头的行会被忽略"></textarea>
          </div>
          <div class="lab-actions">
            <button id="batch-open" class="btn-secondary">导入文件</button>
            <button id="batch-sample" class="btn-secondary">示例数据</button>
            <span class="spacer"></span>
            <button id="batch-stop" class="btn-stop hidden">■ 停止</button>
            <button id="batch-run" class="btn-primary">▶ 开始评测</button>
          </div>
        </div>
        <div class="lab-main">
          <div id="batch-summary" class="stat-grid"></div>
          <div id="batch-results" class="result-wrap">
            <div class="empty-hint">评测结果会显示在这里</div>
          </div>
        </div>
      </section>

      <!-- ---- 模型对比 ---- -->
      <section id="lab-compare" class="lab-panel hidden">
        <div class="lab-side">
          <div class="lab-group grow">
            <label class="lab-label">提示词 <span class="lab-hint">每行一条</span></label>
            <textarea id="cmp-prompts" spellcheck="false" placeholder="用一句话解释什么是闭包&#10;把「你好，世界」翻译成日语"></textarea>
          </div>
          <div class="lab-group">
            <div class="lab-label-row">
              <label class="lab-label">对比配置</label>
              <button id="cmp-add" class="btn-mini">＋ 添加</button>
            </div>
            <div id="cmp-configs" class="cmp-configs"></div>
          </div>
          <div class="lab-row">
            <div class="lab-group">
              <label class="lab-label">每条重复</label>
              <input type="number" id="cmp-repeats" min="1" max="10" step="1">
            </div>
            <div class="lab-group">
              <label class="lab-label">并发数</label>
              <input type="number" id="cmp-concurrency" min="1" max="32" step="1">
            </div>
          </div>
          <div class="lab-actions">
            <button id="cmp-sample" class="btn-secondary">示例数据</button>
            <span class="spacer"></span>
            <button id="cmp-stop" class="btn-stop hidden">■ 停止</button>
            <button id="cmp-run" class="btn-primary">▶ 开始对比</button>
          </div>
        </div>
        <div class="lab-main">
          <div id="cmp-summary" class="result-wrap">
            <div class="empty-hint">对比结果会显示在这里</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ======== 设置弹窗 ======== -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>设置</h2>
        <button class="modal-close" id="btn-settings-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>DeepSeek API Key <span id="key-status" class="key-status"></span></label>
          <div class="key-row">
            <input type="password" id="input-apikey" placeholder="sk-..." autocomplete="off">
            <button id="btn-save-key" class="btn-secondary">保存 Key</button>
          </div>
          <div class="field-hint">保存在本机，使用系统级加密（Windows DPAPI / safeStorage），不会上传。</div>
        </div>
        <div class="field">
          <label>模型</label>
          <select id="input-model">
            <option value="deepseek-chat">deepseek-chat（支持工具调用）</option>
            <option value="deepseek-reasoner">deepseek-reasoner（深度思考）</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field">
            <label>温度 <span id="temp-value"></span></label>
            <input type="range" id="input-temperature" min="0" max="2" step="0.1">
          </div>
          <div class="field">
            <label>最大输出 tokens</label>
            <input type="number" id="input-maxtokens" min="512" max="8192" step="256">
          </div>
        </div>
        <div class="field">
          <label>工具执行确认模式</label>
          <select id="input-approval">
            <option value="confirm-dangerous">确认危险操作（推荐）：执行命令 / 越界写入前询问</option>
            <option value="confirm-all">每次工具调用都确认</option>
            <option value="auto">全自动执行（谨慎）</option>
          </select>
        </div>
        <div class="field">
          <label>智能体工作目录</label>
          <div class="key-row">
            <input type="text" id="input-workspace" readonly>
            <button id="btn-pick-workspace" class="btn-secondary">选择目录</button>
          </div>
        </div>
        <div class="field">
          <label>API 地址（高级）</label>
          <input type="text" id="input-baseurl" placeholder="https://api.deepseek.com">
        </div>
      </div>
      <div class="modal-foot">
        <button id="btn-settings-save" class="btn-primary">保存设置</button>
      </div>
    </div>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="app.js"></script>
  <script src="lab.js"></script>
</body>
</html>
